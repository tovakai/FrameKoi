name: FrameKoi build smoke test

on:
  push:
    branches: [master, fix/frame-controller-init]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout with VRGIN submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Test controller startup, render scopes and game locomotion
        run: dotnet run --project tests/ControllerInitialization/ControllerInitialization.csproj --configuration Release
      - name: Test production menu pointer and UI confirmation
        run: dotnet run --project tests/MenuPointer/MenuPointer.csproj --configuration Release
      - name: Provide .NET 3.5 reference assemblies for legacy VRGIN
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net35 -Version 1.0.3 -OutputDirectory "$env:RUNNER_TEMP\\reference-assemblies" -NonInteractive
          $root = Join-Path $env:RUNNER_TEMP "reference-assemblies\\Microsoft.NETFramework.ReferenceAssemblies.net35.1.0.3\\build"
          if (-not (Test-Path (Join-Path $root ".NETFramework\\v3.5"))) {
            throw "Expected .NET 3.5 reference pack not found under $root"
          }
          "TargetFrameworkRootPath=$root" >> $env:GITHUB_ENV
      - name: Pin unversioned VRGIN_OpenXR Unity packages in CI checkout
        shell: pwsh
        run: |
          $project = "VRGIN_OpenXR/VRGIN_OpenXR.csproj"
          [xml]$document = Get-Content -Path $project
          $refs = @($document.SelectNodes('//*[local-name()="PackageReference"]'))
          $patched = 0
          foreach ($ref in $refs) {
            if ($ref.Include -like "IllusionLibs.KoikatsuSunshine.UnityEngine.*" -and -not $ref.Version) {
              $ref.SetAttribute("Version", "2019.4.9")
              $patched++
            }
          }
          if ($patched -ne 14) { throw "Expected 14 Unity packages, updated $patched" }
          $document.Save((Resolve-Path $project).Path)
      - name: Build Sunshine main-game plugin
        run: dotnet build KKS_VR/KKS_Game.csproj --configuration Release --verbosity minimal
      - name: Configure full Visual Studio MSBuild for legacy VRGIN
        uses: microsoft/setup-msbuild@v2
      - name: Build Koikatsu main-game plugin
        run: msbuild KK_VR/KK_Game.csproj -restore -p:Configuration=Release -verbosity:minimal
      - name: Upload compiled FrameKoi test binaries
        uses: actions/upload-artifact@v4
        with:
          name: FrameKoi-test-binaries
          if-no-files-found: error
          retention-days: 14
          path: |
            bin/KK/KoikatuVR.dll
            bin/KKS/KKS_MainGameVR.dll
            SteamVR/actions.json
            SteamVR/bindings_frame_controller.json
            docs/HEADSET-TEST.md
            docs/HARDWARE-FIXES.md

