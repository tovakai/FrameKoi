name: FrameKoi build smoke test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout with VRGIN submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Provide .NET 3.5 reference assemblies for legacy VRGIN
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net35 -Version 1.0.3 -OutputDirectory "$env:RUNNER_TEMP\\reference-assemblies" -NonInteractive
          $root = Join-Path $env:RUNNER_TEMP "reference-assemblies\\Microsoft.NETFramework.ReferenceAssemblies.net35.1.0.3\\build"
          if (-not (Test-Path (Join-Path $root ".NETFramework\\v3.5"))) {
            throw "Expected .NET 3.5 reference pack not found under $root"
          }
          "TargetFrameworkRootPath=$root" >> $env:GITHUB_ENV
      - name: Pin unversioned VRGIN_OpenXR Unity packages in CI checkout
        shell: pwsh
        run: |
          $project = "VRGIN_OpenXR/VRGIN_OpenXR.csproj"
          $source = Get-Content -Path $project -Raw
          $patched = [regex]::Replace($source, '(<PackageReference Include="IllusionLibs\\.KoikatsuSunshine\\.UnityEngine\\.[^"]+")\\s*/>', '$1 Version="2019.4.9" />')
          if ($source -eq $patched) { throw "No VRGIN_OpenXR package references were patched" }
          Set-Content -Path $project -Value $patched
      - name: Build Sunshine main-game plugin
        run: dotnet build KKS_VR/KKS_Game.csproj --configuration Release --verbosity minimal
      - name: Build Koikatsu main-game plugin
        continue-on-error: true
        run: dotnet build KK_VR/KK_Game.csproj --configuration Release --verbosity minimal
